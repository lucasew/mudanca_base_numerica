[tools]
"clang-format" = "18.1.8"

[tasks]
lint = "clang-format --dry-run -Werror main.c src/basecalc.c src/basecalc.h src/error_reporter.c src/error_reporter.h tests/test_basecalc.c tests/test_basecalc.h"
fmt = "clang-format -i main.c src/basecalc.c src/basecalc.h src/error_reporter.c src/error_reporter.h tests/test_basecalc.c tests/test_basecalc.h"
test = "make && ./basecalc --test"
install = 'echo "No dependencies to install"'
codegen = 'echo "No codegen to run"'
ci = { depends = ["lint", "test"], description = "Run CI pipeline" }
