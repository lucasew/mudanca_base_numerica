[tools]
"npm:workspaced" = "0.1.0"
# Python 2.7.18 is required for node-sass@4.14.1 (dependency of workspaced@0.1.0)
python = "2.7.18"
# Node 14 is required for node-sass@4.14.1
node = "14.21.3"

[tasks]
install = 'echo "No dependencies to install"'
lint = { run = "workspaced codebase lint", description = "Lint the codebase" }
fmt = { run = "workspaced codebase format", description = "Format the codebase" }
codegen = { run = "echo 'No codegen to run'", description = "Run code generation" }
test = { run = "make && ./basecalc --test", description = "Run tests" }
ci = { depends = ["lint", "test"], description = "Run CI pipeline" }
